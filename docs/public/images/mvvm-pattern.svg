<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" fill="none">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- View box -->
  <rect x="40" y="120" width="180" height="100" rx="12" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" fill="#c0caf5" font-size="20" font-weight="600">View</text>
  <text x="130" y="182" text-anchor="middle" fill="#565f89" font-size="13">React + observer()</text>
  <text x="130" y="198" text-anchor="middle" fill="#565f89" font-size="13">maps data → UI</text>

  <!-- ViewModel / Store box -->
  <rect x="310" y="40" width="200" height="120" rx="12" fill="#1a1b26" stroke="#bb9af7" stroke-width="2"/>
  <text x="410" y="78" text-anchor="middle" fill="#c0caf5" font-size="20" font-weight="600">ViewModel</text>
  <text x="410" y="98" text-anchor="middle" fill="#bb9af7" font-size="14">(Store)</text>
  <text x="410" y="122" text-anchor="middle" fill="#565f89" font-size="13">observable data</text>
  <text x="410" y="140" text-anchor="middle" fill="#565f89" font-size="13">+ actions &amp; logic</text>

  <!-- Model data box -->
  <rect x="310" y="200" width="200" height="100" rx="12" fill="#1a1b26" stroke="#9ece6a" stroke-width="2"/>
  <text x="410" y="240" text-anchor="middle" fill="#c0caf5" font-size="20" font-weight="600">Model</text>
  <text x="410" y="262" text-anchor="middle" fill="#565f89" font-size="13">initModel({ ... })</text>
  <text x="410" y="278" text-anchor="middle" fill="#565f89" font-size="13">data + computed values</text>

  <!-- External services box -->
  <rect x="590" y="120" width="100" height="100" rx="12" fill="#1a1b26" stroke="#565f89" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="640" y="164" text-anchor="middle" fill="#565f89" font-size="13">Services</text>
  <text x="640" y="182" text-anchor="middle" fill="#565f89" font-size="13">(APIs, etc.)</text>

  <!-- Arrow: View → ViewModel (user actions) -->
  <path d="M220 145 L305 105" stroke="#7aa2f7" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="240" y="110" fill="#7aa2f7" font-size="12">user events</text>

  <!-- Arrow: ViewModel → View (data binding) -->
  <path d="M310 130 L225 155" stroke="#9ece6a" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="232" y="155" fill="#9ece6a" font-size="12">reactive binding</text>

  <!-- Arrow: ViewModel ↔ Model (contains) -->
  <path d="M410 160 L410 196" stroke="#bb9af7" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="450" y="185" fill="#bb9af7" font-size="12">exposes</text>

  <!-- Arrow: ViewModel → Services -->
  <path d="M510 100 L586 145" stroke="#565f89" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>

  <!-- Arrowhead definitions -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#7aa2f7" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#9ece6a" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#bb9af7" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#565f89" stroke-width="1.2"/>
    </marker>
  </defs>
</svg>
