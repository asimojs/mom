<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" fill="none">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <marker id="as-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#9ece6a" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- LEFT: typical React component -->
  <text x="155" y="24" text-anchor="middle" fill="#565f89" font-size="14" font-weight="500">Typical React component</text>

  <rect x="40" y="40" width="230" height="220" rx="12" fill="#1a1b26" stroke="#f7768e" stroke-width="2"/>
  <text x="155" y="72" text-anchor="middle" fill="#c0caf5" font-size="16" font-weight="600">MyComponent</text>

  <rect x="60" y="88" width="190" height="24" rx="4" fill="#24283b"/>
  <text x="155" y="105" text-anchor="middle" fill="#f7768e" font-size="12">useState, useEffect, useRef</text>

  <rect x="60" y="120" width="190" height="24" rx="4" fill="#24283b"/>
  <text x="155" y="137" text-anchor="middle" fill="#f7768e" font-size="12">business logic &amp; validation</text>

  <rect x="60" y="152" width="190" height="24" rx="4" fill="#24283b"/>
  <text x="155" y="169" text-anchor="middle" fill="#f7768e" font-size="12">async fetching &amp; callbacks</text>

  <rect x="60" y="184" width="190" height="24" rx="4" fill="#24283b"/>
  <text x="155" y="201" text-anchor="middle" fill="#7aa2f7" font-size="12">JSX rendering</text>

  <text x="155" y="240" text-anchor="middle" fill="#f7768e" font-size="11">everything mixed together</text>

  <!-- Arrow -->
  <path d="M300 150 L380 150" stroke="#9ece6a" stroke-width="2" marker-end="url(#as-green)"/>
  <text x="340" y="140" text-anchor="middle" fill="#9ece6a" font-size="12">extract</text>

  <!-- RIGHT: mom split -->
  <text x="540" y="24" text-anchor="middle" fill="#565f89" font-size="14" font-weight="500">With mom stores</text>

  <!-- Store box -->
  <rect x="400" y="40" width="220" height="150" rx="12" fill="#1a1b26" stroke="#bb9af7" stroke-width="2"/>
  <text x="510" y="68" text-anchor="middle" fill="#c0caf5" font-size="16" font-weight="600">Store (ViewModel)</text>

  <rect x="418" y="82" width="184" height="24" rx="4" fill="#24283b"/>
  <text x="510" y="99" text-anchor="middle" fill="#bb9af7" font-size="12">observable state &amp; computed</text>

  <rect x="418" y="114" width="184" height="24" rx="4" fill="#24283b"/>
  <text x="510" y="131" text-anchor="middle" fill="#bb9af7" font-size="12">business logic &amp; validation</text>

  <rect x="418" y="146" width="184" height="24" rx="4" fill="#24283b"/>
  <text x="510" y="163" text-anchor="middle" fill="#bb9af7" font-size="12">async init &amp; service calls</text>

  <!-- View box -->
  <rect x="435" y="210" width="150" height="50" rx="12" fill="#1a1b26" stroke="#7aa2f7" stroke-width="2"/>
  <text x="510" y="240" text-anchor="middle" fill="#7aa2f7" font-size="14" font-weight="600">View (React)</text>
  <text x="510" y="252" text-anchor="middle" fill="#565f89" font-size="11">only JSX mapping</text>

  <!-- Connector line -->
  <line x1="510" y1="192" x2="510" y2="208" stroke="#565f89" stroke-width="1.2" stroke-dasharray="4 3"/>
</svg>
